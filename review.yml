findings:
- Absence is the finding. A FTSE-250 global real estate advisor with 42,000 people
  in 70 countries publishes no developer portal, no API documentation, no
  machine-readable contract, no SDK, no Postman collection and no changelog.
- Savills unambiguously runs internal APIs — search.savills.com/js/endpoints.js
  names four of them by hostname — and publishes none of them. The estate is
  private by construction, not gated by licence.
- >-
  api.savills.com is live and answers in JSON, which makes it tempting to treat
  as a developer surface. It is not — every path returns
  {"statusCode": 404, "message": "Resource not found"} and nothing about it is
  documented. Recording the status was the only honest thing to do with it.
- No RESO anywhere, and structurally there could not be. RESO is a NAR/MLS
  mechanism, the UK has no MLS, and Savills' US arm is commercial rather than
  residential-MLS. The RESO certified-organizations list contains no UK entries
  at all.
- No open data from Savills. The open UK property layer is HM Land Registry
  Price Paid and Ordnance Survey — public sector, not brokerage. Savills
  Research is a publication programme, not a dataset.
- The access gate is none-published rather than partner-only. Calling it
  partner-only would imply a partner programme; none is published, and the only
  documented route is a general corporate contact form.
- Contrast with the portals in the same market is instructive. Zoopla at least
  publishes readable OpenAPI contracts for its member-agent surface even though
  credentials are membership-gated. Savills, as a brokerage, is a supplier into
  that pipe and exposes nothing at all — the listing data it produces reaches
  the market through Rightmove, Zoopla and OnTheMarket via agency CRM software,
  never through a Savills API.

