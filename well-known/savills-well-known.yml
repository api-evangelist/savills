note: >-
  Probed the standard /.well-known/ discovery surface across every Savills host known
  to this profile — the three consumer/corporate sites, the property-search front end,
  the api. gateway, the investor-relations host, the Savills Investment Management
  site, and the three internal service hosts named in the property search's own
  endpoints.js (livev6-searchapi, livev6-authentication, livev6-profile). Sixty
  requests were made with a browser User-Agent (an unbranded agent is answered with a
  WAF 403 rather than a real status, so every probe below used a browser UA). Nothing
  returned 200. Notably, livev6-authentication.savills.com — the authentication service
  the consumer property search actually calls — serves no OpenID Connect discovery
  document and no RFC 8414 authorization-server metadata, so even the internal estate
  is undiscoverable anonymously. The single non-404 is a WAF 403 on the
  investor-relations host, which is an edge refusal rather than a document.
  No WellKnown and no SecurityTxt pointer is emitted, because nothing was found.
